<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리더의 자리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --text: #15181e;
  --muted: #5d6573;
  --line: #dde1e8;
  --accent: #3b5bdb;
  --accent-soft: #e7ecff;
  --pos: #1f8a5b;
  --neg: #c2413b;
  --warn-soft: #fff4e0;
  --warn: #9a5b00;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218;
    --surface: #171b23;
    --surface-2: #1f2430;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --line: #2a303d;
    --accent: #7b93ff;
    --accent-soft: #232b4a;
    --pos: #4cc38a;
    --neg: #f07b72;
    --warn-soft: #2e2516;
    --warn: #f0b860;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218;
  --surface: #171b23;
  --surface-2: #1f2430;
  --text: #e8eaf0;
  --muted: #9aa3b2;
  --line: #2a303d;
  --accent: #7b93ff;
  --accent-soft: #232b4a;
  --pos: #4cc38a;
  --neg: #f07b72;
  --warn-soft: #2e2516;
  --warn: #f0b860;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
h1, h2, h3 { line-height: 1.3; margin: 0; }
button { font: inherit; color: inherit; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: .02em; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: var(--shadow); }
.stack > * + * { margin-top: 16px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 10px; border: 1px solid var(--accent);
  background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .choice:focus-visible, .role:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* intro */
.hero h1 { font-size: 34px; margin: 6px 0 10px; }
.principles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.principle { background: var(--surface-2); border-radius: 10px; padding: 14px; }
.principle b { display: block; margin-bottom: 4px; }
.sources { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.sources a { color: var(--muted); }

/* roles */
.roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.role {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px; cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
}
.role:hover { border-color: var(--accent); }
.role h3 { font-size: 19px; }
.cells { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }

/* game header */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.progress { display: flex; gap: 6px; }
.dot { width: 26px; height: 6px; border-radius: 3px; background: var(--line); }
.dot.done { background: var(--accent); }
.dot.now { background: var(--accent); opacity: .45; }
.meters { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
.meter { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.meter .row { display: flex; justify-content: space-between; font-size: 13px; }
.meter .val { font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .6s ease; }
.delta { font-size: 12px; font-weight: 700; margin-left: 4px; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }

/* scenario */
.tagline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cat { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.src { font-size: 12px; color: var(--muted); }
.scenario h2 { font-size: 24px; margin-top: 8px; }
.voices { display: grid; gap: 8px; }
.voice { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; }
.voice b { font-size: 13px; color: var(--muted); font-weight: 600; display: block; }
.event { background: var(--warn-soft); border-radius: 10px; padding: 14px 16px; }
.event b { color: var(--warn); }
.hint { background: var(--surface-2); border-radius: 10px; padding: 14px 16px; font-size: 15px; }
.hintbtn { background: none; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; color: var(--muted); width: 100%; text-align: left; font-size: 14px; }
.hintbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.hintbtn:disabled { cursor: default; opacity: .6; }
.choices { display: grid; gap: 10px; }
.choice {
  text-align: left; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; display: flex; gap: 12px; align-items: flex-start;
}
.choice:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.choice:disabled { cursor: default; opacity: .45; }
.choice.picked { opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
.choice .key { flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--surface-2); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.result { border-top: 1px solid var(--line); padding-top: 18px; }
.fx { display: flex; flex-wrap: wrap; gap: 6px; }
.fx span { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); font-weight: 600; }
.debrief { background: var(--surface-2); border-radius: 10px; padding: 14px 16px; }
.debrief b { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.later { font-size: 14px; color: var(--warn); }

/* report */
.archetype { background: var(--accent-soft); border-radius: 14px; padding: 22px; }
.archetype h2 { font-size: 28px; margin: 4px 0 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.radar text { font-size: 12px; fill: var(--muted); font-family: inherit; }
.log { list-style: none; padding: 0; margin: 0; }
.log li { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.log li:last-child { border-bottom: none; }
.log .r { color: var(--muted); font-size: 13px; }
ol.plan { padding-left: 20px; margin: 0; }
ol.plan li + li { margin-top: 8px; }
.footer { margin-top: 28px; font-size: 12px; color: var(--muted); text-align: center; }

@media (max-width: 680px) {
  .principles, .roles, .grid2 { grid-template-columns: 1fr; }
  .meters { grid-template-columns: repeat(3, 1fr); }
  .card { padding: 18px; }
  .hero h1 { font-size: 28px; }
}
</style>
</head>

const S = {};
const app = document.getElementById("app");

function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; }
function fxChips(fx) {
  return Object.entries(fx).filter(([, v]) => v).map(([k, v]) => {
    const m = METRICS.find(x => x.k === k);
    return `<span class="${v > 0 ? "pos" : "neg"}">${m.icon} ${m.label} ${v > 0 ? "+" : ""}${v}</span>`;
  }).join("");
}
function applyFx(fx) {
  const d = {};
  for (const [k, v] of Object.entries(fx)) {
    const before = S.metrics[k];
    S.metrics[k] = Math.max(0, Math.min(100, before + v * UNIT));
    d[k] = S.metrics[k] - before;
  }
  return d;
}

function startRole(id) {
  S.roleId = id;
  S.role = ROLES[id];
  S.rounds = [...S.role.rounds, { ...FINALE, choices: S.role.finale }];
  S.i = 0;
  S.metrics = Object.fromEntries(METRICS.map(m => [m.k, 50]));
  S.tags = Object.fromEntries(Object.keys(COMPETENCIES).map(k => [k, 0]));
  S.log = [];
  S.pending = [];
  S.hints = HINTS_PER_GAME;
  S.lastDelta = {};
  renderRound();
}

function metersHtml() {
  return `<div class="meters">${METRICS.map(m => {
    const v = S.metrics[m.k], d = S.lastDelta[m.k];
    const dHtml = d ? `<span class="delta ${d > 0 ? "pos" : "neg"}">${d > 0 ? "+" : ""}${d}</span>` : "";
    return `<div class="meter"><div class="row"><span>${m.icon} ${m.label}</span><span><span class="val">${v}</span>${dHtml}</span></div><div class="bar"><i style="width:${v}%"></i></div></div>`;
  }).join("")}</div>`;
}

function header() {
  const dots = S.rounds.map((_, j) => `<span class="dot ${j < S.i ? "done" : j === S.i ? "now" : ""}"></span>`).join("");
  return `
    <div class="topbar">
      <div><span class="eyebrow">${S.role.name}</span> <span class="small muted">· ${Math.min(S.i + 1, S.rounds.length)} / ${S.rounds.length}</span></div>
      <div class="progress">${dots}</div>
    </div>
    ${metersHtml()}`;
}

function renderRound() {

  const events = due.map(p => `
    <div class="event"><b>🕒 지난 결정의 결과 · ${p.title}</b><div>${p.text}</div><div class="fx" style="margin-top:8px">${fxChips(p.fx)}</div></div>`).join("");

  const choices = sc.choices.map((c, j) => `

  app.replaceChildren(el(`

    <article class="card scenario stack">
      ${events}
      <div>
        <div class="tagline"><span class="cat">${isFinale ? "🔥 " : ""}${sc.cat}</span>${sc.src ? `<span class="src">📖 ${sc.src}</span>` : ""}</div>
        <h2>${sc.title}</h2>
      </div>
      <p style="margin:0">${sc.context}</p>
      ${voices ? `<div class="voices">${voices}</div>` : ""}
      ${hintBlock}
      <div class="choices">${choices}</div>
      <div id="result"></div>
    </article>`));

  const hb = document.getElementById("hintBtn");
  if (hb) hb.onclick = () => {
    S.hints--;
    S.lastDelta = applyFx({ speed: -1 });
    refreshMeters();
    document.getElementById("hintArea").innerHTML = `<div class="hint">📚 ${sc.hint}</div>`;
  };
  app.querySelectorAll(".choice").forEach(b => b.onclick = () => choose(+b.dataset.j));
}

function refreshMeters() {
  const cur = app.querySelector(".meters");
  if (cur) cur.replaceWith(el(metersHtml()));
}

function choose(j) {
  const sc = S.rounds[S.i];
  const c = sc.choices[j];
  S.lastDelta = applyFx(c.fx);
  c.tags.forEach(t => S.tags[t]++);
  S.log.push({ round: S.i + 1, title: sc.title, choice: c.t, tags: c.tags });
  if (c.later) S.pending.push({ ...c.later, at: S.i + c.later.in, from: sc.title });

  app.querySelectorAll(".choice").forEach(b => { b.disabled = true; if (+b.dataset.j === j) b.classList.add("picked"); });
  const hb = document.getElementById("hintBtn"); if (hb) hb.disabled = true;
  refreshMeters();

  const last = S.i === S.rounds.length - 1;
  document.getElementById("result").innerHTML = `
    <div class="result stack">
      <div class="fx">${fxChips(c.fx)}</div>
      <p style="margin:0">${c.note}</p>
      ${c.later ? `<div class="later">🕒 이 결정의 결과 일부는 나중에 드러납니다.</div>` : ""}
      ${c.tags.length ? `<div class="small muted">드러난 역량: ${c.tags.join(" · ")}</div>` : ""}
      <div class="debrief"><b>회고 질문</b>${sc.debrief}</div>
      <div><button class="btn" id="next">${last ? "리더십 리포트 보기 →" : "다음 상황 →"}</button></div>
    </div>`;
  const next = document.getElementById("next");
  next.focus({ preventScroll: true });
  document.getElementById("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
  next.onclick = () => { S.i++; if (last) renderReport(); else { renderRound(); window.scrollTo({ top: 0, behavior: "smooth" }); } };
}

function radarSvg() {
  const keys = Object.keys(COMPETENCIES);
  const max = Math.max(1, ...keys.map(k => S.tags[k]));
  const cx = 150, cy = 140, R = 95, n = keys.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + (2 * Math.PI * i) / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const rings = [0.33, 0.66, 1].map(f => `<polygon points="${keys.map((_, i) => pt(i, R * f).join(",")).join(" ")}" fill="none" stroke="var(--line)"/>`).join("");
  const axes = keys.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`; }).join("");
  const poly = keys.map((k, i) => pt(i, R * Math.max(0.06, S.tags[k] / max)).join(",")).join(" ");
  const labels = keys.map((k, i) => { const [x, y] = pt(i, R + 20); return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle">${k} ${S.tags[k]}</text>`; }).join("");
  return `<svg class="radar" viewBox="0 0 300 280" width="100%" role="img" aria-label="리더십 역량 분포">${rings}${axes}<polygon points="${poly}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2"/>${labels}</svg>`;
}

function renderReport() {
  const ranked = Object.entries(S.tags).sort((a, b) => b[1] - a[1]);
  const top = ranked[0][1] > 0 ? ranked[0][0] : "조율";
  const second = ranked[1][1] > 0 ? ranked[1][0] : null;
  const low = ranked.filter(([, v]) => v === 0).map(([k]) => k);
  const arch = COMPETENCIES[top];
  S.lastDelta = {};
  const best = METRICS.reduce((a, m) => S.metrics[m.k] > S.metrics[a.k] ? m : a);
  const worst = METRICS.reduce((a, m) => S.metrics[m.k] < S.metrics[a.k] ? m : a);

  const log = S.log.map(l => `<li><div class="r">${l.round}. ${l.title}</div>${l.choice}${l.tags.length ? ` <span class="chip">${l.tags.join(" · ")}</span>` : ""}</li>`).join("");
  const unseen = S.pending.length ? `
    <div class="card stack">
      <h3>🕒 아직 드러나지 않은 결과</h3>
      ${S.pending.map(p => `<div class="event"><b>${p.from} → ${p.title}</b><div>${p.text}</div></div>`).join("")}
      <p class="small muted" style="margin:0">게임은 끝났지만, 이 결정들의 결과는 다음 분기에 찾아옵니다.</p>
    </div>` : "";

  app.replaceChildren(el(`
    ${header()}
    <section class="stack">
      <div class="archetype">
        <div class="eyebrow">${S.role.name}로서의 리더십 스타일</div>
        <h2>${arch.name}</h2>
        <p style="margin:0 0 8px">${arch.strength}${second ? ` 두 번째로 많이 드러난 역량은 <b>${second}</b>입니다.` : ""}</p>
        <p class="small" style="margin:0"><b>성장 포인트</b> · ${arch.grow}</p>
      </div>
      <div class="grid2">
        <div class="card"><h3 style="margin-bottom:8px">역량 분포</h3>${radarSvg()}</div>
        <div class="card stack">
          <h3>지표 요약</h3>
          <p style="margin:0">가장 잘 지킨 지표는 <b>${best.icon} ${best.label}(${S.metrics[best.k]})</b>, 가장 많이 내준 지표는 <b>${worst.icon} ${worst.label}(${S.metrics[worst.k]})</b>입니다.</p>
          ${low.length ? `<p style="margin:0">이번 게임에서 한 번도 드러나지 않은 역량: <b>${low.join(", ")}</b></p>` : ""}
          <div class="debrief"><b>함께 이야기해 볼 질문</b>내가 내준 지표는 의도한 대가였나요, 놓친 비용이었나요?</div>
        </div>
      </div>
      ${unseen}
      <div class="card stack">
        <h3>결정 기록</h3>
        <ul class="log">${log}</ul>
      </div>
      <div class="card stack">
        <div class="eyebrow">이 샘플을 실제 교육 프로그램으로 만든다면</div>
        <ol class="plan">
          <li><b>현장 인터뷰로 시나리오 현실화</b> · 팀장과 셀 리더를 인터뷰해 실제로 겪은 딜레마로 시나리오를 바꿉니다.</li>
          <li><b>회사 리더십 원칙과 연결</b> · 7개 역량 태그를 회사의 리더십 원칙과 평가 기준에 맞춰 다시 정의합니다.</li>
          <li><b>크로스팀 동시 플레이 워크숍</b> · ‘블랙 먼데이’를 세 팀장이 함께 플레이하며 공유 자원을 협상하는 반나절 워크숍으로 운영합니다.</li>
          <li><b>평가가 아닌 성장 도구로</b> · 결과는 점수가 아니라 1on1과 리더 코칭에서 쓸 대화 소재로 활용합니다.</li>
        </ol>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="again">다른 팀으로 플레이</button>
        <button class="btn ghost" id="home">처음으로</button>
      </div>
    </section>`));
  document.getElementById("again").onclick = renderRoles;
  document.getElementById("home").onclick = renderIntro;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

renderIntro();
</script>
<div class="footer">공개 자료 기반 비공식 샘플 · 시나리오와 수치는 가상입니다</div>
</body>
</html>
